name: CI

# Every pull request and every push to main runs the full test suite, which
# includes the base-help coach gate (src/help_docs.rs). Until this existed,
# nothing ran before a merge; the release workflow was the first test.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # `release.sh` reads `v$OLD..HEAD`, so the rehearsal below needs tags.
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test
      # Cut a whole release in a throwaway clone. It runs here rather than in a
      # job of its own because it reuses this one's target directory and cargo
      # registry; on its own it would pay for both again. 0.13.16's first
      # attempt died on a step order every other test passed.
      - name: release rehearsal
        run: ./scripts/test-release-rehearsal.sh

  # scripts/ast/test_*.py existed and passed and NOTHING RAN THEM (#85). A
  # full-tree grep for their names, for `pytest` and for `scripts/ast/test`
  # matched their own docstrings and nothing else, which is how #66's extension
  # drift survived: the regression guards for that exact area were hand-run only.
  #
  # The grammar-free rows already ride `cargo test` through
  # tests/ast_extension_registry.rs. These are the rows that need the extractor's
  # wheels, so they get a job of their own -- and a required one. An advisory job
  # here would reproduce the defect it was filed to fix.
  python-ast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/ast/requirements.txt
      - name: Install extractor dependencies
        run: python -m pip install -r scripts/ast/requirements.txt
      # Discovered, not listed: a test added to scripts/ast/ runs from the day it
      # lands rather than the day someone remembers this file. The count is
      # printed and ZERO IS A FAILURE -- a glob that matches nothing must never
      # read as a pass, which is the shape that let a tripwire report PASS having
      # opened no files at all.
      #
      # `rc` is accumulated and the last statement is `exit "$rc"`: every test
      # runs even after one fails, and the job's status is the job's rather than
      # whatever the final command happened to think.
      - name: scripts/ast/test_*.py
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(scripts/ast/test_*.py)
          echo "found ${#tests[@]} test file(s): ${tests[*]:-<none>}"
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "FAIL: no scripts/ast/test_*.py were found - this job proved nothing."
            exit 1
          fi
          rc=0
          for t in "${tests[@]}"; do
            echo "== $t"
            python "$t" || rc=1
          done
          echo "ran ${#tests[@]} test file(s); rc=$rc"
          exit "$rc"

  # Every changelog.py command line the release assembles, run with the argv it
  # assembles. 0.13.16 nearly died on one that every other test had missed.
  # The second script runs the workflow's two packing steps and reads what they
  # produced: through v0.14.1 every published asset carried the binary and
  # scripts/ and no license text, and nothing here could have noticed. A step
  # rather than a job because this runner is already checked out; the image
  # ships pwsh, which the Windows leg needs.
  release-invocations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/test-release-invocations.sh
      - run: ./scripts/test-release-packaging.sh
      # #95: the attribute is what decides what a Windows clone materialises, and
      # this runner is ubuntu — so the check reads `git check-attr`, not the checkout.
      - run: ./scripts/test-crlf-attributes.sh

  # base publishes base-windows-x86_64.zip on every release and, until 0.14.3, no
  # test and no lint had ever run on Windows (#108). release.yml's Windows leg is a
  # plain `cargo build --release`: compiled once, zipped, shipped, and nothing else
  # on that platform ever checked.
  #
  # Its own job rather than a matrix leg on `test`. That job's second step is
  # ./scripts/test-release-rehearsal.sh, a bash release rehearsal that is
  # Linux-shaped, so a Windows leg would need an `if:` skipping it -- and a leg
  # called `test` that quietly runs half of what the name says is worse than no
  # leg at all, because it reports a name it did not earn.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # ast_extension_registry.rs, ast_automap_test.rs and
      # ast_extractor_notices_test.rs shell `python` on Windows and FAIL rather
      # than skip when it is absent (ast_extension_registry.rs:14-15, :33 -- "a
      # skip here is indistinguishable from a pass"). Pinned rather than trusted
      # to whatever the image happens to ship.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # --no-fail-fast because cargo test ABORTS at the first failing target and
      # runs the rest of them never. This job's first run proved the cost: it
      # stopped at ast_automap_test (4th of the suite, alphabetically) and so
      # tests/hook_log_tier_test.rs -- the failure #108 was FILED for -- did not
      # execute at all, and #108's own claim went unmeasured by the job built to
      # measure it. A first-ever Windows job that reveals one failure per 8-minute
      # round trip is worth little; this one reports every Windows failure at once.
      - run: cargo test --no-fail-fast

  # Required, not advisory. It was `continue-on-error: true` "until the three
  # pre-existing never_loop denies in src/crud are cleared" -- they are: a
  # repo-wide grep for never_loop matches zero lines, and the step itself has been
  # `success` on main (run 34200195605, job clippy, step 5). An advisory lint job
  # reports the RUN green whether the step passed or failed, which is how a real
  # Windows failure sat on main unnoticed (#97, #108).
  # …and since 0.14.3 it runs on both platforms. A Linux-only lint is how
  # doorbell.rs's BUDGET -- dead on Windows and only on Windows -- passed every
  # check base had, for months (#97). fail-fast is off so a failure on one
  # platform never hides the other's result: telling the two apart is the point.
  clippy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
