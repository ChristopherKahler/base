name: CI

# Every pull request and every push to main runs the full test suite, which
# includes the base-help coach gate (src/help_docs.rs). Until this existed,
# nothing ran before a merge; the release workflow was the first test.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test

  # Every changelog.py command line the release assembles, run with the argv it
  # assembles. 0.13.16 nearly died on one that every other test had missed.
  release-invocations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/test-release-invocations.sh

  # Advisory until the three pre-existing never_loop denies in src/crud are
  # cleared; then drop continue-on-error and it becomes a required check.
  clippy:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
