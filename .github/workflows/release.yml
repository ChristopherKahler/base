name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # The base-help coach is fetched from this tag by every `base update`, so a
  # tag whose coach lags the binary ships stale documentation to every machine.
  # src/help_docs.rs holds the coach to the CLI; refuse to build if it fails.
  docs-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: base-help coach matches this binary
        run: cargo test --bin base help_docs

  build:
    needs: docs-gate
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: base-linux-x86_64.tar.gz
            binary: base
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: base-windows-x86_64.zip
            binary: base.exe
          - target: aarch64-apple-darwin
            os: macos-14
            asset: base-darwin-aarch64.tar.gz
            binary: base
          # Intel Macs. Without this there is no macOS download at all for anyone
          # on pre-2020 hardware — not a broken install, simply nothing to install.
          # Cross-compiled from the ARM runner; macos-14 ships both toolchains.
          - target: x86_64-apple-darwin
            os: macos-14
            asset: base-darwin-x86_64.tar.gz
            binary: base

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p staging/scripts/ast
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} staging/
          strip staging/${{ matrix.binary }} || true
          cp scripts/ast/*.py staging/scripts/ast/
          cp scripts/ast/requirements.txt staging/scripts/ast/
          cd staging
          tar -czf ../${{ matrix.asset }} ${{ matrix.binary }} scripts/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging/scripts/ast | Out-Null
          Copy-Item target/${{ matrix.target }}/release/${{ matrix.binary }} staging/
          Copy-Item scripts/ast/*.py staging/scripts/ast/
          Copy-Item scripts/ast/requirements.txt staging/scripts/ast/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4

      # Every release body but three was this install template and nothing else,
      # so the tag was the only record of what changed. CHANGELOG.md now carries
      # that record, and `cargo test` refuses a version that has no section, so
      # this step cannot find nothing.
      - name: Release notes for this tag
        run: |
          python3 scripts/changelog.py extract "${GITHUB_REF_NAME#v}" > release-notes.md
          cat >> release-notes.md <<'FOOTER'

          ---
          ## Install

          ```bash
          npx chrisai
          ```

          Or download the binary for your platform below.

          **Chris AI Systems** · https://www.skool.com/claude-code-titans-9203
          FOOTER

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            base-linux-x86_64.tar.gz/base-linux-x86_64.tar.gz
            base-windows-x86_64.zip/base-windows-x86_64.zip
            base-darwin-aarch64.tar.gz/base-darwin-aarch64.tar.gz
            base-darwin-x86_64.tar.gz/base-darwin-x86_64.tar.gz
          body_path: release-notes.md

  # Tell the docs site a release happened. It fetches the coach's reference files
  # and this changelog at the tag and opens its own pull request; nothing is
  # pushed from here. Skipped rather than failed when the token is absent, so a
  # release never fails on the docs half.
  notify-docs:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to basemode-docs
        env:
          GH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          # Tested in the shell rather than in an `if:` expression: the secrets
          # context is not available to step conditions, and a skip that says why
          # in the log beats one that silently evaluates to false.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "DOCS_DISPATCH_TOKEN is not set on this repository; the docs site will"
            echo "pick this release up on its hourly poll instead. Skipping."
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ChristopherKahler/basemode-docs/dispatches \
            -d "{\"event_type\":\"base-release\",\"client_payload\":{\"tag\":\"${GITHUB_REF_NAME}\",\"sha\":\"${GITHUB_SHA}\"}}"
