# The replay corpus's config (tests/replay_test.rs), appended to the seed's global base.toml.
# The budgets are the defaults, stated so the replay names what it checks against: since BO-02
# they are the 10,000 bytes `base doctor --measure` measured on Claude Code 2.1.287 (they were
# 9,000 and 4,000). The first screen is held to 1,990, FS1's bar (tests/deferral_test.rs): where
# DUE NOW is trimmed to fit, it is trimmed to the bar, and every case is held to it.
[bracket]
enabled = true

[budget]
session_start_bytes = 10000
prompt_bytes = 10000
first_screen_chars = 1990
