[package]
name = "base"
version = "0.13.19"
edition = "2024"
description = "Proactive context-injection engine for Claude Code"

[dependencies]
oxigraph = "0.4"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
chrono = "0.4"
dirs = "5"
glob = "0.3"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["cors", "set-header"] }
include_dir = "0.7"
open = "5"
ureq = { version = "2", features = ["json"] }
sha2 = "0.11.0"
rpassword = "7"
pdf-extract = "0.10.0"

[features]
# Enabled ONLY for test builds, via the self-dev-dependency below. `cfg(test)`
# cannot do this job: `tests/*.rs` link the library compiled without it, so an
# integration test that forgot to isolate would read the real home unchecked.
# Off for every `cargo build` / `cargo run`, so production never redirects.
isolation-guard = []

[dev-dependencies]
base = { path = ".", features = ["isolation-guard"] }
tempfile = "3"
